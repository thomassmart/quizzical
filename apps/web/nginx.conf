worker_processes auto;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Re-resolve compose DNS when the API container is recreated (avoids sticky 502s).
  # Podman bridge DNS; Docker Desktop uses 127.0.0.11 — add that first if you run Docker.
  resolver 10.89.7.1 valid=10s ipv6=off;
  resolver_timeout 2s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Decoded media max 25 MB; base64 JSON needs headroom (~35m).
    client_max_body_size 35m;

    # Variable form forces runtime DNS; no URI suffix so the full request path is kept.
    set $api_upstream http://api:4000;

    location = /healthz {
      proxy_pass $api_upstream;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location = /readyz {
      proxy_pass $api_upstream;
      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
    }

    location /api/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 35m;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location /media/ {
      proxy_pass $api_upstream;
      proxy_connect_timeout 5s;
    }

    location /ws {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_connect_timeout 5s;
    }

    location /mcp/health {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location /mcp {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;
      client_max_body_size 35m;
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
