apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: quizzical-web
  labels:
    app.kubernetes.io/name: quizzical
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: quizzical-web
  labels:
    app.kubernetes.io/name: quizzical
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: apps/web/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: quizzical-web:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
