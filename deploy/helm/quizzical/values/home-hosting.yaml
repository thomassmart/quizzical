# Deploy on home-hosting.mts.id.au from GitHub Container Registry images.
#
# After the Publish containers workflow runs (push to main / tag / manual):
#   ghcr.io/thomassmart/quizzical-api:latest
#   ghcr.io/thomassmart/quizzical-web:latest
#
# Packages are published public on main so the cluster can pull without
# imagePullSecrets. Pin to sha-<short> if you want a specific build.

image:
  api: ghcr.io/thomassmart/quizzical-api:latest
  web: ghcr.io/thomassmart/quizzical-web:latest
  postgres: docker.io/library/postgres:16-alpine
  pullPolicy: Always

imagePullSecrets: []

postgres:
  storage: 5Gi

media:
  storage: 5Gi

replicaCount: 1

route:
  host: quizzical.apps.home-hosting.mts.id.au
  tlsTermination: edge

resources:
  api:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  web:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
