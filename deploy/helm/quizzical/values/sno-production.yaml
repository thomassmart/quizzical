# Single-node OpenShift (venue)
resources:
  api:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  web:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  postgres:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgres:
  storage: 20Gi

media:
  storage: 20Gi

replicaCount: 1

route:
  host: ""
