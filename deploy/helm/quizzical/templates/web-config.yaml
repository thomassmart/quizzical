apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quizzical.name" . }}-nginx
  labels:
    {{- include "quizzical.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /tmp/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # MCP/base64 media uploads (decoded max 25 MB; JSON expands ~4/3).
        client_max_body_size 35m;
        location = /healthz {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/healthz;
          proxy_connect_timeout 5s;
          proxy_read_timeout 5s;
        }
        location = /readyz {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/readyz;
          proxy_connect_timeout 5s;
          proxy_read_timeout 5s;
        }
        location /api/ {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/api/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          client_max_body_size 35m;
          proxy_read_timeout 300s;
        }
        location /media/ {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/media/;
          client_max_body_size 35m;
        }
        location /ws {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/ws;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_read_timeout 3600s;
        }
        location /mcp {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/mcp;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_buffering off;
          client_max_body_size 35m;
          proxy_connect_timeout 10s;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
        location /mcp/health {
          proxy_pass http://{{ include "quizzical.name" . }}-api:4000/mcp/health;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_connect_timeout 5s;
          proxy_read_timeout 10s;
        }
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
