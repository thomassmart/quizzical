apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quizzical.name" . }}-pgdata
  labels:
    {{- include "quizzical.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quizzical.name" . }}-media
  labels:
    {{- include "quizzical.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.media.storage }}
