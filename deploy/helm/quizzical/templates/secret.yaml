apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quizzical.name" . }}-secrets
  labels:
    {{- include "quizzical.labels" . | nindent 4 }}
type: Opaque
stringData:
  HOST_PASSWORD: {{ .Values.hostPassword | quote }}
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
  {{- if .Values.mcpToken }}
  MCP_TOKEN: {{ .Values.mcpToken | quote }}
  {{- end }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.postgres.password (include "quizzical.name" .) .Values.postgres.database | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  LLM_CHAT_MODEL: {{ .Values.llm.chatModel | quote }}
  LLM_EMBED_MODEL: {{ .Values.llm.embedModel | quote }}
  LLM_FALLBACK_CHAT_MODEL: {{ .Values.llm.fallbackChatModel | quote }}
