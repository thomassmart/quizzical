apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quizzical.name" . }}-postgres
  labels:
    {{- include "quizzical.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quizzical.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "quizzical.name" . }}
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: {{ include "quizzical.name" . }}
      # anyuid SCC (needed for postgres UID 999) has no seccompProfiles; omit seccompProfile.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.image.postgres }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quizzical.name" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "quizzical.name" . }}-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quizzical.name" . }}-postgres
  labels:
    {{- include "quizzical.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: {{ include "quizzical.name" . }}
    app.kubernetes.io/component: postgres
